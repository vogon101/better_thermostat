# FLAT: publish a release when manifest.json on `flat` carries a version that has no tag yet.
name: FLAT release

on:
  push:
    branches: [flat]
    paths: [custom_components/better_thermostat/manifest.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          v=$(jq -r .version custom_components/better_thermostat/manifest.json)
          if gh release view "$v" >/dev/null 2>&1; then echo "release $v exists"; exit 0; fi
          gh release create "$v" --target flat --title "$v" --notes "Upstream $(cat FLAT_BASE) + FLAT patches (see FLAT.md)."
